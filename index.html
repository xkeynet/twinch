<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <!-- =========================================================
       DOCUMENT
       ========================================================= -->
  <title>Twinch</title>

  <meta name="application-name" content="Twinch">
  <meta name="apple-mobile-web-app-title" content="Twinch">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- =========================================================
       SEO
       ========================================================= -->
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">

  <meta
    name="description"
    content="Twinch je interaktivní platforma pro objevování lidí, navazování kontaktů s možností přímé monetizace obsahu."
  >

  <link rel="canonical" href="https://twinch.cz/">

  <!-- =========================================================
       STRUCTURED DATA
       ========================================================= -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Twinch",
    "url": "https://twinch.cz/",
    "description": "Twinch je interaktivní platforma pro objevování lidí, navazování kontaktů s možností přímé monetizace obsahu.",
    "inLanguage": "cs-CZ"
  }
  </script>

  <!-- =========================================================
       OPEN GRAPH
       ========================================================= -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Twinch">
  <meta property="og:title" content="Twinch">

  <meta
    property="og:description"
    content="Twinch je interaktivní platforma pro objevování lidí, navazování kontaktů s možností přímé monetizace obsahu."
  >

  <meta property="og:url" content="https://twinch.cz/">

  <meta
    property="og:image"
    content="https://twinch.cz/assets/logo/twinch-og.png"
  >

  <meta
    property="og:image:secure_url"
    content="https://twinch.cz/assets/logo/twinch-og.png"
  >

  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Twinch">
  <meta property="og:locale" content="cs_CZ">

  <!-- =========================================================
       TWITTER / X
       ========================================================= -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Twinch">

  <meta
    name="twitter:description"
    content="Twinch je interaktivní platforma pro objevování lidí, navazování kontaktů s možností přímé monetizace obsahu."
  >

  <meta
    name="twitter:image"
    content="https://twinch.cz/assets/logo/twinch-og.png"
  >

  <meta name="twitter:image:alt" content="Twinch">
  <meta name="twitter:url" content="https://twinch.cz/">

  <!-- =========================================================
       FAVICONS
       ========================================================= -->
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/assets/logo/favicon-16x16.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/assets/logo/favicon-32x32.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="48x48"
    href="/assets/logo/favicon-48x48.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="64x64"
    href="/assets/logo/favicon-64x64.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="128x128"
    href="/assets/logo/favicon-128x128.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/assets/logo/favicon-192x192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="256x256"
    href="/assets/logo/favicon-256x256.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="/assets/logo/favicon-512x512.png"
  >

  <!-- =========================================================
       APPLE TOUCH ICON
       ========================================================= -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/assets/logo/favicon-180x180.png"
  >

  <!-- =========================================================
       BROWSER / SYSTEM THEME
       ========================================================= -->
  <meta
    name="theme-color"
    content="#467BFF"
    id="themeColor"
  >

  <meta
    name="msapplication-TileColor"
    content="#467BFF"
  >

  <meta
    name="color-scheme"
    content="light dark"
  >

  <!-- =========================================================
       INTER
       ========================================================= -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
  >

  <!-- =========================================================
       PRELOAD
       ========================================================= -->
  <link
    rel="preload"
    href="/assets/logo/twinch-quote.png"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <link
    rel="preload"
    href="/assets/logo/twinch-logo.png"
    as="image"
    type="image/png"
    fetchpriority="high"
  >

  <link
    rel="preload"
    href="/assets/logo/twinch-blue.png"
    as="image"
    type="image/png"
  >

  <!-- =========================================================
       GOOGLE ANALYTICS — GA4
       ========================================================= -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-1XNG6LNG2H"
  ></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      window.dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-1XNG6LNG2H');
  </script>

  <!-- =========================================================
       APP CSS
       ========================================================= -->
  <link
    rel="stylesheet"
    href="/assets/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/assets/css/navbar.css"
  >

  <link
    rel="stylesheet"
    href="/assets/safety/block.css"
  >
</head>

<body>
  <main class="intro" id="intro">
    <div class="intro__content">

      <!-- =====================================================
           TWINCH WORDMARK
           ===================================================== -->
      <div
        class="intro__wordmark-stage"
        id="introWordmarkStage"
        aria-hidden="true"
        hidden
      >
        <img
          class="intro__wordmark"
          id="introWordmark"
          src="/assets/logo/twinch-logo.png"
          alt=""
          decoding="async"
          fetchpriority="high"
          draggable="false"
        >
      </div>

      <!-- =====================================================
           TWINCH QUOTE
           ===================================================== -->
      <div
        class="intro__heart-stage"
        id="introHeartStage"
        aria-hidden="true"
      >
        <img
          class="intro__heart intro__heart--white"
          id="introHeartWhite"
          src="/assets/logo/twinch-quote.png"
          alt=""
          decoding="async"
          fetchpriority="high"
          draggable="false"
        >
      </div>

    </div>
  </main>

  <!-- =========================================================
       MAIN APP
       ========================================================= -->
  <main
    class="twinch-app"
    id="twinchApp"
    hidden
  >
    <!-- =======================================================
         TOP NAVIGATION
         ======================================================= -->
    <header class="top-brand">
      <!-- =====================================================
           TWINCH LOGO
           ===================================================== -->
      <img
        class="top-brand__logo"
        src="/assets/logo/twinch-blue.png"
        alt="Twinch"
        decoding="async"
        draggable="false"
      >

      <!-- =====================================================
           TOP ACTIONS
           ===================================================== -->
      <nav
        class="top-nav"
        aria-label="Secondary navigation"
      >
        <!-- ===================================================
             CAMERA
             =================================================== -->
        <button
          type="button"
          class="top-nav__button top-nav__button--camera"
          aria-label="Camera"
        >
          <img
            class="top-nav__icon top-nav__icon--camera"
            src="/assets/icons/cam.svg"
            alt=""
            aria-hidden="true"
            draggable="false"
          >
        </button>

        <!-- ===================================================
             HEART
             =================================================== -->
        <button
          type="button"
          class="top-nav__button top-nav__button--heart"
          aria-label="Heart"
        >
          <img
            class="top-nav__icon top-nav__icon--heart"
            src="/assets/icons/life.svg"
            alt=""
            aria-hidden="true"
            draggable="false"
          >
        </button>

        <!-- ===================================================
             MENU
             =================================================== -->
        <button
          type="button"
          class="top-nav__button top-nav__button--menu"
          aria-label="Menu"
        >
          <img
            class="top-nav__icon top-nav__icon--menu"
            src="/assets/icons/hamburger.svg"
            alt=""
            aria-hidden="true"
            draggable="false"
          >
        </button>
      </nav>
    </header>

    <!-- =======================================================
         PLAY OVERLAY
         ======================================================= -->
    <img
      id="playOverlay"
      src="/assets/icons/play.svg"
      alt=""
      aria-hidden="true"
      draggable="false"
    >

    <!-- =======================================================
         BOTTOM NAVIGATION
         ======================================================= -->
    <nav
      class="nav"
      aria-label="Primary navigation"
    >
      <!-- =====================================================
           VIDEO SEEK
           ===================================================== -->
      <div
        class="seek-wrap"
        id="seekWrap"
        aria-hidden="true"
      >
        <div
          class="seek-pill"
          id="seekPill"
        >
          <div
            class="seek-fill"
            id="seekFill"
          ></div>
        </div>
      </div>

      <!-- =====================================================
           VIDEO TIMER
           ===================================================== -->
      <div
        class="seek-time"
        id="seekTime"
        aria-hidden="true"
      >
        <span class="t-cur">00:00</span>
        <span class="t-sep"> / </span>
        <span class="t-tot">00:00</span>
      </div>

      <!-- =====================================================
           NAV ITEMS
           ===================================================== -->
      <ul>
        <li>
          <button
            type="button"
            class="nav-button nav-button--home"
            aria-label="Home"
          >
            <img
              class="nav-icon nav-icon--home"
              src="/assets/icons/home.svg"
              alt=""
              aria-hidden="true"
              draggable="false"
            >
          </button>
        </li>

        <li>
          <button
            type="button"
            class="nav-button nav-button--search"
            aria-label="Search"
          >
            <img
              class="nav-icon nav-icon--search"
              src="/assets/icons/search.svg"
              alt=""
              aria-hidden="true"
              draggable="false"
            >
          </button>
        </li>

        <li>
          <button
            type="button"
            class="nav-button nav-button--add"
            aria-label="Add"
          >
            <img
              class="add-plus-svg"
              src="/assets/icons/plus.svg"
              alt=""
              aria-hidden="true"
              draggable="false"
            >
          </button>
        </li>

        <li>
          <button
            type="button"
            class="nav-button nav-button--messages"
            aria-label="Messages"
          >
            <img
              class="nav-icon nav-icon--messages"
              src="/assets/icons/messages.svg"
              alt=""
              aria-hidden="true"
              draggable="false"
            >
          </button>
        </li>

        <li>
          <button
            type="button"
            class="nav-button nav-button--profile"
            id="profileBtn"
            aria-label="Profile"
          >
            <img
              class="nav-icon nav-icon--profile"
              src="/assets/icons/user.svg"
              alt=""
              aria-hidden="true"
              draggable="false"
            >
          </button>
        </li>
      </ul>
    </nav>
  </main>

  <!-- =========================================================
       NOSCRIPT FALLBACK
       ========================================================= -->
  <noscript>
    <style>
      .intro__sequence,
      .intro__line {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translate3d(0, 0, 0) !important;
      }

      .intro__heart-stage {
        display: none !important;
      }
    </style>
  </noscript>

  <!-- =========================================================
       APP JS
       ========================================================= -->
  <script
    src="/assets/safety/block.js"
    defer
  ></script>

  <script
    src="/assets/js/app.js"
    defer
  ></script>

  <script
    src="/assets/js/navbar.js"
    defer
  ></script>
</body>
</html>
