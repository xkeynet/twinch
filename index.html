       ========================================================= -->
  <meta name="theme-color" content="#ffffff">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="color-scheme" content="light">

  <!-- =========================================================
       PRELOAD
       ========================================================= -->
  <link rel="preload" href="/assets/img/tinder-a-badoo.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="/assets/img/uz-te-staly-dost.png" as="image" type="image/png">
  <link rel="preload" href="/assets/img/twinch-to-cele-zmeni.png" as="image" type="image/png">

  <!-- =========================================================
       GOOGLE ANALYTICS
       ========================================================= -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-V582S5LGZ3"
  ></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      window.dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-V582S5LGZ3');
  </script>

  <!-- =========================================================
       APP CSS
       ========================================================= -->
  <link rel="stylesheet" href="/assets/css/app.css">
</head>

<body>
  <main class="intro" id="intro">
    <div class="intro__content">

      <!-- =====================================================
           SLOGAN SEQUENCE
           ===================================================== -->
      <div class="intro__sequence" id="introSequence">
        <img
          class="intro__line intro__line--1"
          id="introLine1"
          src="/assets/img/tinder-a-badoo.png"
          alt="Tinder a Badoo"
          decoding="async"
          fetchpriority="high"
          draggable="false"
        >

        <img
          class="intro__line intro__line--2"
          id="introLine2"
          src="/assets/img/uz-te-staly-dost.png"
          alt="už tě stály dost"
          decoding="async"
          draggable="false"
        >

        <img
          class="intro__line intro__line--3"
          id="introLine3"
          src="/assets/img/twinch-to-cele-zmeni.png"
          alt="Twinch to celé změní"
          decoding="async"
          draggable="false"
        >

        <img
          class="intro__line intro__line--4"
          id="introLine4"
          src="/assets/img/uz-brzy.png"
          alt="už brzy"
          decoding="async"
          draggable="false"
        >
      </div>

      <!-- =====================================================
           HEART
           ===================================================== -->
      <div class="intro__heart-stage" id="introHeartStage" aria-hidden="true">
        <img
          class="intro__heart"
          id="introHeart"
          src="/assets/logo/life-red.png"
          alt=""
          decoding="async"
          draggable="false"
        >
      </div>

    </div>
  </main>

  <noscript>
    <style>
      .intro__sequence,
      .intro__line {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translate3d(0, 0, 0) !important;
      }

      .intro__heart-stage {
        display: none !important;
      }
    </style>
  </noscript>

  <script src="/assets/js/app.js" defer></script>
</body>
</html>
